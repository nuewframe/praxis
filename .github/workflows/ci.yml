name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: plugin self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu ships bash 5; macos ships bash 3.2 — the declared floor.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          bash --version | head -1
          python3 --version
          jq --version || true

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y jq; fi
          fi
          jq --version

      - name: validate-plugin (16 structural checks)
        run: bash scripts/validate-plugin.sh

      - name: shipped gates run against Praxis
        run: bash .github/run-self-conformance.sh

      - name: probe language-coverage self-test
        run: bash scripts/test-probes.sh

      # The coverage matrix and the doctrine index used to be generated by matching a
      # pattern against the working tree (TS.260821.07). Both are now sections of a
      # published document derived from the record, and this is what checks them: publish
      # the set and fail if anything moved. The record is the source; the document is the
      # projection; the diff is the proof.
      - name: the published set is current
        run: |
          cargo run -q --bin praxis -- publish 0.8.0
          git diff --exit-code -- docs/releases/ || {
            echo "the published set is stale — run: cargo run --bin praxis -- publish <version>" >&2
            exit 1
          }

      - name: every shipped surface is anchored, and every guarantee has a keeper
        run: |
          cargo run -q --bin praxis -- check
          cargo run -q --bin praxis -- audit-surfaces
          cargo run -q --bin praxis -- check-invariants

      - name: enforcement scripts parse under this bash
        run: |
          rc=0
          for s in scripts/check-*.sh scripts/*.sh .github/*.sh; do
            bash -n "$s" || { echo "syntax error: $s"; rc=1; }
          done
          exit $rc
